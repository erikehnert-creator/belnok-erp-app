<style>
:root {
  --blau: #1F4E79; --graphit: #1F2328; --offwhite: #F5F5F2; --kupfer: #A86A3D;
  --flaeche: #ffffff; --linie: #d9dbd6; --text: var(--graphit); --leise: #5b6168;

  --hinter: var(--offwhite);
}
@media (prefers-color-scheme: dark) {

    --hinter: #15181c; --flaeche: #1f2328; --linie: #353a41; --text: #e9eae6; --leise: #a5abb3;
    --blau: #6f9fd0; --gelb: #4a3f12; --gelb-rand: #8c7621; --gruen: #6cc08e; --rot: #ff8a80;

}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; background: var(--hinter); color: var(--text); }
header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--graphit); color: #F5F5F2; position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }

nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }

nav button:hover { border-color: #4a5058; }
nav button.aktiv { background: #F5F5F2; color: var(--graphit); }
main { padding: 16px; max-width: 1400px; margin: 0 auto; }
.karte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
h2 { margin: 0 0 12px; font-size: 18px; color: var(--blau); }
h3 { margin: 16px 0 8px; font-size: 15px; }
.zweispaltig { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; align-items: start; }

.ergebnis { position: sticky; top: 64px; }

.feld { display: flex; flex-direction: column; gap: 3px; font-size: 13px; margin-bottom: 6px; }
.feld > span { color: var(--leise); }
.feld textarea { font: inherit; padding: 8px; border: 1px solid var(--linie); border-radius: 6px; background: var(--flaeche); color: inherit; width: 100%; box-sizing: border-box; resize: vertical; }

.liste { list-style: none; padding: 0; margin: 0; } .liste li { padding: 6px 0; border-bottom: 1px solid var(--linie); }

td.schicht { font-size: 12px; white-space: nowrap; text-align: center; padding: 3px; }

td.schicht.s-Na { background: color-mix(in srgb, var(--blau) 30%, transparent); }

.warnung { color: var(--rot); font-weight: 600; }
.knoepfe { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 8px 0; }
dt { color: var(--leise); } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

.tabelle { overflow-x: auto; }

.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
.badge.gruen { color: var(--gruen); } .badge.gelb { color: #8a6d00; background: var(--gelb); } .badge.rot { color: var(--rot); }
.klein { font-size: 12px; color: var(--leise); }
.preisleiste { position: relative; height: 26px; margin: 8px 0 34px; background: var(--hinter); border-radius: 4px; }
.preisleiste .stufe { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.preisleiste .s3 { background: color-mix(in srgb, var(--blau) 30%, transparent); }
.preisleiste .s2 { background: color-mix(in srgb, var(--blau) 55%, transparent); z-index: 1; }
.preisleiste .s1 { background: var(--blau); z-index: 2; }
.preisleiste .marke { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--kupfer); z-index: 3; }
.preisleiste .legende { position: absolute; top: 30px; left: 0; right: 0; display: flex; justify-content: space-between; font-size: 12px; color: var(--leise); gap: 6px; flex-wrap: wrap; }
#meldung { position: fixed; bottom: 16px; left: 50%; transform: translate(-50%, 120%); background: var(--graphit); color: #fff; padding: 8px 16px; border-radius: 8px; transition: transform .2s; max-width: calc(100% - 32px); z-index: 5; }

.stempeluhr { text-align: center; }
.stempeluhr p.gross { font-size: 22px; font-weight: 600; margin: 8px 0 14px; }
button.gross { font-size: 22px; padding: 18px 48px; min-width: 220px; }
.tagewahl { display: flex; gap: 4px 14px; flex-wrap: wrap; }
.tagewahl label.check { margin: 4px 0; }
.tagewahl input, label.check input { width: auto; }
nav button.abmelden { color: #b9bec5; border-color: #4a5058; }
#ablage[onclick], #ablage.rot { cursor: pointer; }
.unterreiter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.unterreiter button.aktiv { background: var(--blau); color: #fff; border-color: var(--blau); }
.karte.rand-rot { border-color: var(--rot); } .karte.rand-gruen { border-color: var(--gruen); } .karte.rand-gelb { border-color: var(--gelb-rand); }
.maschinengruppe { border-top: 1px solid var(--linie); padding-top: 6px; margin-top: 10px; }
.scanfeld input { flex: 1; min-width: 200px; font-size: 18px; padding: 10px; }
.karte.scan h2 { font-size: 22px; }
.scan-bestand { font-size: 22px; margin: 10px 0; }
.knoepfe.gross button { font-size: 18px; padding: 14px 20px; }
.doku-eintrag { border-top: 1px solid var(--linie); padding: 8px 0; }
.doku-eintrag p { margin: 4px 0; white-space: pre-wrap; }
.doku-bilder { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
.doku-bilder img { max-width: 220px; max-height: 165px; border-radius: 6px; border: 1px solid var(--linie); object-fit: cover; }
textarea { width: 100%; font: inherit; }
/* Kalkulation: Ampel Gewinn / ±0 / Verlust */
.ampel { border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; border: 2px solid; }
.ampel-gruen { border-color: var(--gruen); background: color-mix(in srgb, var(--gruen) 12%, transparent); }
.ampel-gelb { border-color: var(--gelb-rand); background: var(--gelb); }
.ampel-rot { border-color: var(--rot); background: color-mix(in srgb, var(--rot) 12%, transparent); }
.ampel-titel { font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 13px; }
.ampel-gruen .ampel-titel, .ampel-gruen .ampel-zahl { color: var(--gruen); }
.ampel-rot .ampel-titel, .ampel-rot .ampel-zahl { color: var(--rot); }
.ampel-zahl { font-size: 26px; font-weight: 700; } .ampel-zahl span { font-size: 14px; font-weight: 400; }
dl.schema dt.leise, dl.schema dd.leise, tr.leise td { color: var(--leise); font-size: 12px; }
.rabatt { border-top: 1px solid var(--linie); margin-top: 12px; }
/* 0.12: Seitenköpfe */
.ergebnis th, .ergebnis td { white-space: normal; }
/* 0.12: Seitenköpfe, Listen, Auswahlkarten, Werkstatt, Scannen, Menü */
h1 { margin: 0; font-size: 22px; color: var(--text); }
.seitenkopf { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; margin: 4px 0 14px; }
.seitenkopf h2 { margin: 0; }
.seitenkopf .unterreiter, .seitenkopf .knoepfe { margin: 0; }
input.suche { font-size: 16px; padding: 10px 12px; margin-bottom: 12px; }
.zeilen { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.zeile { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; padding: 10px 8px; border-bottom: 1px solid var(--linie); }
.zeile-haupt { flex: 1 1 260px; min-width: 0; }
.zeile-zahlen { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.zeile .kette { flex-basis: 100%; }
.klickbar { cursor: pointer; }
.klickbar:hover, tr.klickbar:hover td { background: color-mix(in srgb, var(--blau) 7%, transparent); }
.zeile.aktiv { background: color-mix(in srgb, var(--blau) 12%, transparent); }
.zweispaltig.gleich { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 900px) { .zweispaltig.gleich { grid-template-columns: minmax(0, 1fr); } }
.umschalter { display: inline-flex; border: 1px solid var(--linie); border-radius: 8px; overflow: hidden; }
.umschalter button { border: none; border-radius: 0; }
.umschalter button.aktiv { background: var(--blau); color: #fff; }
.wahlraster { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 10px 0; }
button.wahl { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 12px 14px; border-radius: 10px; min-height: 76px; }
button.wahl span { font-size: 12px; color: var(--leise); }
button.wahl.einmalig { border-left: 4px solid var(--kupfer); }
button.wahl.empfohlen { border: 2px solid var(--gruen); }
button.wahl:hover { background: color-mix(in srgb, var(--blau) 6%, var(--flaeche)); }
details.mehr-felder { margin: 8px 0; }
details.mehr-felder > summary { cursor: pointer; color: var(--blau); font-size: 13px; margin-bottom: 6px; }
details.phase.entfaellt { opacity: .55; border-style: dashed; }
label.check.gross-check { font-size: 16px; font-weight: 600; padding: 8px 10px; border: 1px solid var(--linie); border-radius: 8px; width: fit-content; }
label.check.gross-check input { width: 20px; height: 20px; }
.gross-nr { font-size: 20px; color: var(--blau); }
button.gefahr { color: var(--rot); border-color: var(--rot); }
.kette { display: flex; flex-wrap: wrap; gap: 3px; margin: 3px 0; }
.glied { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--hinter); color: var(--leise); border: 1px solid var(--linie); white-space: nowrap; }
.glied.gruen { background: color-mix(in srgb, var(--gruen) 18%, transparent); color: var(--gruen); border-color: var(--gruen); }
.glied.blau { background: var(--blau); color: #fff; border-color: var(--blau); }
.glied.gelb { background: var(--gelb); color: #6b5500; border-color: var(--gelb-rand); }
.ap-karte.frei { border-left-color: var(--gelb-rand); }
.ap-karte.wartet { border-left-color: var(--linie); opacity: .85; }
.ap-karte.fokus { outline: 3px solid var(--kupfer); }
.ap-karte .knoepfe button { min-height: 42px; }
details.karte > summary { cursor: pointer; }
.unterreiter.klein-reiter button { padding: 4px 10px; font-size: 13px; }
.stepper { display: flex; gap: 6px; }
.stepper button { font-size: 22px; width: 48px; padding: 4px 0; }
.stepper input { font-size: 22px; text-align: center; }
nav details.mehr { position: relative; }
nav details.mehr > summary { list-style: none; color: #dfe2e6; padding: 6px 12px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
nav details.mehr > summary::-webkit-details-marker { display: none; }
nav details.mehr > summary.aktiv { background: #F5F5F2; color: var(--graphit); }
nav details.mehr > summary:hover { border-color: #4a5058; }
nav .mehr-liste { position: absolute; right: 0; top: calc(100% + 4px); background: var(--graphit); border: 1px solid #4a5058; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; min-width: 190px; z-index: 4; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
nav .mehr-liste button { text-align: left; }
nav .mehr-liste { max-width: calc(100vw - 16px); }
nav button.scan-knopf { border-color: var(--kupfer); color: #fff; background: var(--kupfer); }
.kamera { position: fixed; inset: 0; background: #000; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #fff; }
.kamera video { max-width: 100%; max-height: 75vh; }
.kamera-rahmen { position: absolute; width: min(60vw, 60vh); aspect-ratio: 1; border: 3px solid var(--kupfer); border-radius: 12px; pointer-events: none; top: 50%; left: 50%; transform: translate(-50%, -58%); }
@media (max-width: 700px) { header { position: static; } header .zusatz { display: none; } nav { margin-left: 0; width: 100%; } nav button, nav details.mehr > summary { padding: 6px 9px; } }
@media print { header, nav, button, .knoepfe { display: none; } .karte { border: none; } }
/* 0.24: Handy und Tablet */
@media (max-width: 700px) {
  main { padding: 10px; }
  .karte { padding: 12px; border-radius: 8px; margin-bottom: 12px; }
  input, select, textarea, .feld textarea { font-size: 16px; } /* iPhone zoomt sonst beim Tippen */
  .zweispaltig.filter { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 10px; }
  .raster { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  header { padding: 8px 10px; gap: 8px; }
  /* Hauptnavigation einzeilig zum Wischen statt ein Viertel der Höhe */
  nav { gap: 2px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  nav > * { flex: none; }
  .tabelle table.stapel thead { display: none; }
  .tabelle table.stapel, .tabelle table.stapel tbody, .tabelle table.stapel tr { display: block; width: 100%; }
  .tabelle table.stapel tr { border: 1px solid var(--linie); border-radius: 8px; padding: 6px 10px; margin: 0 0 8px; }
  .tabelle table.stapel td { display: flow-root; border: none; padding: 4px 0; white-space: normal; text-align: left; overflow-wrap: anywhere; }
  .tabelle table.stapel td::before { content: attr(data-label); float: left; width: 37%; margin-right: 3%; padding-top: 2px; color: var(--leise); font-size: 12px; overflow-wrap: anywhere; }
  .tabelle table.stapel td:first-child { font-weight: 600; }
  .tabelle table.stapel td:first-child::before, .tabelle table.stapel td[data-label=""]::before { display: none; }
  .tabelle table.stapel td:empty { display: none; }
  .tabelle table.stapel td input:not([type=checkbox]), .tabelle table.stapel td select { width: 60%; min-width: 0; }
  .tabelle table.stapel td.zahl { text-align: left; }
  .knoepfe.gross button { flex: 1 1 140px; }
  .seitenkopf h1 { font-size: 20px; }
}
/* Finger statt Maus: größere Knöpfe */
@media (pointer: coarse) {
  button, .knopf { min-height: 44px; }
  button.klein { min-height: 40px; padding: 5px 10px; }
  .ap-karte .knoepfe button { min-height: 48px; }
  label.check input { width: 22px; height: 22px; }
}
.feld small.quelle.auto, small.quelle.auto { color: var(--gruen); }
.reihe.abmessung { flex-wrap: wrap; } .reihe.abmessung select { width: auto; flex: 0 0 auto; } .reihe.abmessung input.kurz { width: 5.5em; flex: 1 1 4em; } .reihe.abmessung .mal { color: var(--leise); }
.balken { height: 5px; background: var(--hinter); border-radius: 3px; overflow: hidden; margin-top: 3px; min-width: 60px; }
.balken > span { display: block; height: 100%; background: var(--blau); }
/* Finanzen */
.kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kachel { background: var(--flaeche); border: 1px solid var(--linie); border-left: 4px solid var(--linie); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.kachel.rand-gruen { border-left-color: var(--gruen); } .kachel.rand-gelb { border-left-color: var(--gelb-rand); } .kachel.rand-rot { border-left-color: var(--rot); }
.kachel-titel { font-size: 12px; color: var(--leise); text-transform: uppercase; letter-spacing: .04em; }
.kachel-zahl { font-size: 22px; font-weight: 700; margin: 2px 0; overflow-wrap: anywhere; }
.punkt { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; }
.punkt-gruen { background: var(--gruen); } .punkt-gelb { background: var(--gelb-rand); } .punkt-rot { background: var(--rot); }
td.minus, .zahl.minus { color: var(--rot); } td.stark { font-weight: 600; }
tr.laufend td { background: color-mix(in srgb, var(--blau) 8%, transparent); } tr.summe td { border-top: 2px solid var(--linie); font-weight: 600; }
.diagramm { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; align-items: end; height: 170px; margin: 10px 0 4px; }
.diagramm .spalte { display: flex; flex-direction: column; align-items: center; gap: 2px; height: 100%; }
.diagramm .spalte.zukunft { opacity: .45; }
.saeulen { position: relative; flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 2px; }
.saeule { width: 40%; max-width: 18px; border-radius: 3px 3px 0 0; min-height: 1px; }
